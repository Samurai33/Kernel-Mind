name: ✨ Feature Request
description: Suggest a new feature for KernelMind
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees:
  - kernelmind-team

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Your ideas help make KernelMind even better.
        
        💡 **Tip**: The more detail you provide, the better we can understand and implement your suggestion.

  - type: dropdown
    id: component
    attributes:
  label: Component
  description: Which part of KernelMind is this feature for?
      options:
  - 🎵 Musical Album / New Tracks
  - 💻 Web App
  - 🔌 IDE Extensions
  - 📱 Mobile App
  - 🌐 Website / Documentation
  - 🧠 Binaural Beats / Neuroscience
  - 📉 Analytics / Productivity
  - 🚀 Performance / Optimization
  - 🔄 Sync / Integration
  - 🎮 Gamification / Motivation
  - 🌍 Community / Social
  - 📊 Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
  label: Priority (in your opinion)
  description: How important is this feature to you?
      options:
        - 🔴 Must-have - Crucial para meu workflow
        - 🟠 High - Melhoraria muito minha experiência
        - 🟡 Medium - Seria útil ter
        - 🟢 Low - Nice-to-have
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 📝 Problem or Need
      description: What problem would this feature solve? Or what need would it address?
      placeholder: |
        Ex. "When I'm coding JavaScript, I'd like faster tracks that adapt to my typing rhythm..."
        
        Or: "As a developer working in a team, I need a way to synchronize focus sessions with my colleagues..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
  label: ✨ Proposed Solution
  description: How do you imagine this feature would work?
      placeholder: |
        Descreva sua ideia em detalhes:
        - Como o usuário interagiria com ela?
        - Onde ela apareceria na interface?
        - Como ela se comportaria?
        
        Seja criativo! Não se preocupe com viabilidade técnica por enquanto.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: Have you considered other ways to solve this problem?
      placeholder: |
        - Did you try any temporary solutions?
        - Do you know any tool that does something similar?
        - Do you have other implementation ideas?

  - type: dropdown
    id: user-type
    attributes:
  label: 👤 Developer Type
  description: How do you identify? (to better understand your use case)
      options:
        - Frontend Developer
        - Backend Developer
        - Full-stack Developer
        - Mobile Developer
        - Game Developer
        - Data Scientist / ML Engineer
        - DevOps / SRE
        - UI/UX Designer que programa
        - Estudante de Programação
        - Freelancer
        - Tech Lead / Manager
        - Outro
    validations:
      required: true

  - type: dropdown
    id: languages
    attributes:
  label: 💻 Primary Languages
  description: Which languages do you use the most? (multiple-choice in descriptions)
      options:
        - JavaScript / TypeScript
        - Python
        - Java / Kotlin
        - C# / .NET
        - C / C++
        - Go
        - Rust
        - PHP
        - Ruby
        - Swift / Objective-C
        - Dart / Flutter
        - Scala
        - Clojure
        - Haskell
        - Assembly
        - SQL
        - HTML/CSS
        - Shell scripting
        - Outras (especifique no contexto)

  - type: input
    id: team-size
    attributes:
  label: 👥 Team Size
  description: Do you work alone or in a team? How many people?
  placeholder: Ex. "Solo", "2-5 people", "10+ people"

  - type: textarea
    id: use-cases
    attributes:
      label: 🎯 Detailed Use Cases
      description: In which specific situations would you use this feature?
      placeholder: |
        Ex. "During long debugging sessions..."
        Ex. "When I'm doing pair programming..."
        Ex. "In the last 30 minutes before a deadline..."
        
        The more specific, the better!
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: 🎨 Mockups or Wireframes
      description: Do you have any visual idea? Paste links to images or describe the interface
      placeholder: |
        - Links to mockups (Figma, etc.)
        - Reference screenshots
        - Textual description of the UI
        - User interaction flow

  - type: textarea
    id: technical-notes
    attributes:
      label: 🔧 Technical Considerations
      description: (Optional) Any ideas about technical implementation?
      placeholder: |
        - APIs that could be used
        - Required integrations
        - Performance concerns
        - Privacy considerations

  - type: textarea
    id: success-metrics
    attributes:
      label: 📈 Success Metrics
      description: How will we know this feature was successful?
      placeholder: |
        - How would you measure this feature's success?
        - What behavior would you expect to see?
        - What feedback would indicate it's working well?

  - type: dropdown
    id: contribution
    attributes:
      label: 🤝 Willingness to Contribute
      description: Would you like to help implement this feature?
      options:
        - 🙋 Yes! I can help with code
        - 🎨 Yes! I can help with design/UX
        - 🔬 Yes! I can help with testing/research
        - 📝 Yes! I can help with documentation
        - 📋 Yes! I can provide feedback during development
        - 🙄 I don't have time right now
        - 🤷 I don't know how to help, but I'd like to learn

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm that you:
      options:
        - label: I searched for similar feature requests and found no duplicates
          required: true
        - label: I read the [project roadmap](../IMPLEMENTATION_ROADMAP.md) to see if it's not already planned
          required: false
        - label: I understand this is a suggestion and may not be implemented
          required: true
        - label: I am willing to participate in discussions about this feature
          required: true