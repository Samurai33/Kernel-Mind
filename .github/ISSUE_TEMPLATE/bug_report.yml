name: 🐛 Bug Report
description: Report a bug to help us improve
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees:
  - kernelmind-team

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug! It helps us improve KernelMind for everyone.
        
        👍 **Tip**: Before creating a new issue, please check if a similar one already exists.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of KernelMind is affected?
      options:
        - 🎵 Musical Album / Audio Tracks
        - 💻 Web App
        - 🔌 IDE Extensions (VS Code, JetBrains, etc.)
        - 📱 Mobile App
        - 🌐 Website / Documentation
        - 🧠 Binaural Beats / Neural Effects
        - 🔑 Authentication / User Account
        - 📉 Analytics / Tracking
        - 🚀 Performance / Speed
        - 🔄 Device Sync
        - 🎮 IDE Integration
        - 📊 Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How impactful is this bug?
      options:
        - 🔴 Critical - App unusable / Crash
        - 🟠 High - Core feature broken
        - 🟡 Medium - Secondary feature has issues
        - 🟢 Low - Cosmetic issue / minor UX
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
  label: Bug Description
  description: Clearly describe what is happening
  placeholder: Ex. "When I click the Play button, the music doesn't start and an error appears..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. Scroll to '...'
        4. Observe the error
      value: |
        1. 
        2. 
        3. 
        4. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
  label: Expected Behavior
  description: What did you expect to happen?
  placeholder: Ex. "The music should start playing immediately..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
  label: Actual Behavior
  description: What actually happened?
  placeholder: Ex. "Nothing happens and an error appears in the console..."
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
  label: Browser (if applicable)
  description: Which browser were you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Opera
        - Brave
        - Outro
        - N/A - Não é problema de navegador
    - Other
    - N/A - Not a browser issue

  - type: dropdown
    id: os
    attributes:
  label: Operating System
  description: Which OS are you using?
      options:
        - Windows 11
        - Windows 10
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Ubuntu / Debian
        - Fedora / RHEL
        - Arch Linux
        - iOS
        - Android
        - Outro Linux
        - Outro
    - Other
    validations:
      required: true

  - type: dropdown
    id: ide
    attributes:
  label: IDE/Editor (if applicable)
  description: Which IDE were you using?
      options:
        - VS Code
        - IntelliJ IDEA
        - PyCharm
        - WebStorm
        - PhpStorm
        - Sublime Text
        - Vim/Neovim
        - Emacs
        - Atom
        - Outro
        - N/A - Não estava usando IDE
    - N/A - Not using an IDE

  - type: input
    id: version
    attributes:
  label: KernelMind Version
  description: Which version are you using? (Find in Settings > About)
  placeholder: Ex. "1.2.3" or "latest"
    validations:
      required: true

  - type: textarea
    id: console-logs
    attributes:
      label: Logs / Error Messages
      description: Paste any relevant error messages or logs here
      placeholder: |
        Paste browser console logs, terminal output, or log files.
        
        To access the browser console:
        - Chrome/Edge/Firefox: F12 > Console
        - Safari: Develop > Show JavaScript Console
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any extra information that may help
      placeholder: |
        - How long has this been happening?
        - Does it happen always or intermittently?
        - Were you doing something specific when the bug occurred?
        - Screenshots or videos are very helpful!

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm that you:
      options:
        - label: I searched for similar issues and found no duplicates
          required: true
        - label: I tested with the latest KernelMind version
          required: true
        - label: I read the [troubleshooting guide](../FAQ.md#troubleshooting)
          required: false
        - label: I am willing to help with additional testing if needed
          required: false