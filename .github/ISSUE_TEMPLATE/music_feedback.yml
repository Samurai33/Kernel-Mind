name: 🎵 Music Feedback
description: Feedback about musical tracks or suggestions for improvements
title: "[MUSIC] "
labels: ["music", "feedback", "needs-triage"]
assignees:
  - kernelmind-music-team

body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your feedback about KernelMind music! 
        Your input is essential to help us craft the best sonic experience possible.

        🎵 **Note**: This template is for musical feedback, not technical bugs.

  - type: dropdown
    id: feedback-type
    attributes:
      label: Feedback Type
      description: What type of feedback would you like to share?
      options:
        - 🎼 Feedback about a specific track
        - 🎶 Suggestion for a new track
        - 🧠 Binaural beats feedback
        - 🔊 Audio quality issue
        - 🔄 Suggestion for remix/variation
        - 🎯 General album feedback
        - 🔬 Report of productivity effects
        - 🎮 Suggestion for IDE integration
    validations:
      required: true

  - type: dropdown
    id: track
    attributes:
      label: Track (if applicable)
      description: Which track is the feedback about?
      options:
        - "01 - Boot Kernel"
        - "02 - Interrupt Handler"
        - "03 - Overclock"
        - "04 - Kernel Panic"
        - "05 - Trace Stack"
        - "06 - Memory Leak"
        - "07 - Deadlock"
        - "08 - Garbage Collector"
        - "09 - Reboot Sequence"
        - "All tracks"
        - "N/A - Not about a specific track"

  - type: dropdown
    id: listening-context
    attributes:
      label: Listening Context
      description: In what situation did you listen?
      options:
        - 💻 Actively coding
        - 🔍 Debugging / fixing bugs
        - 📝 Code review
        - 📚 Reading documentation
        - 📈 Planning/architecture
        - ☕ Break/relaxing
        - 🎧 Just listening (not coding)
        - 🌃 Working late at night
        - 🌅 Start of the day
        - 👥 In a shared environment
        - 🏠 Home office
        - 🏢 Office
        - Other
    validations:
      required: true

  - type: dropdown
    id: equipment
    attributes:
      label: Audio Equipment
      description: How did you listen to the music?
      options:
        - 🎧 Over-ear headphones (Sony, Sennheiser, etc.)
        - 🎧 On-ear headphones
        - 🔊 Wired earbuds
        - 🔊 AirPods / wireless earbuds
        - 🔊 Desktop speakers
        - 🔊 Room sound system
        - 💻 Laptop/desktop speakers
        - 📱 Phone/tablet speakers
        - Other
    validations:
      required: true

  - type: dropdown
    id: session-length
    attributes:
      label: Session Length
      description: How long did you listen?
      options:
        - "< 15 minutes"
        - "15-30 minutes"
        - "30-60 minutes"
        - "1-2 hours"
        - "2-4 hours"
        - "> 4 hours"
        - "Full session (loop)"
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: 📝 Your Feedback
      description: Share your thoughts, feelings and observations
      placeholder: |
        - What did you like?
        - What could be improved?
        - How did the music affect your focus/productivity?
        - Did any specific element catch your attention?
        - Did the music match the activity you were doing?
    validations:
      required: true

  - type: textarea
    id: productivity-impact
    attributes:
      label: 📈 Productivity Impact
      description: How did the music affect your work? (if notable)
      placeholder: |
        - Did you feel improved focus?
        - Did it help maintain concentration for longer?
        - Did it reduce distractions?
        - Did it improve mood during work?
        - Did anything hinder or distract?
        - Compared to your normal soundtrack, how was it?

  - type: dropdown
    id: binaural-effects
    attributes:
      label: 🧠 Binaural Beat Effects
      description: Did you notice any effects from neural frequencies?
      options:
        - 🚀 Yes, I felt a noticeable improvement in focus
        - ✅ Maybe, but not sure
        - 🤷 I didn't notice a difference
        - 😕 I felt some discomfort
        - 🎧 I used speakers (effect may not work)
        - 🔍 I need to test more to be sure

  - type: textarea
    id: specific-moments
    attributes:
      label: ✨ Specific Moments
      description: Were there any memorable moments during listening?
      placeholder: |
        - Any part of the music that "fit" perfectly with what you were doing?
        - Moments where rhythm/energy felt perfect
        - Transitions that worked well or poorly
        - Sound elements that stood out (positive or negative)

  - type: dropdown
    id: programming-language
    attributes:
      label: 💻 Linguagem de Programação
      description: Que linguagem você estava usando?
      id: programming-language
      attributes:
        label: 💻 Programming Language
        description: Which language were you using?
      options:
        - JavaScript / TypeScript
        - Python
        - Java
        - C#
        - C++
        - Go
        - Rust
        - PHP
        - Ruby
        - Swift
        - Kotlin
        - Dart
        - SQL
        - HTML/CSS
        - Shell scripting
        - Other
        - Not programming

  - type: dropdown
    id: task-type
    attributes:
      label: 🎯 Tipo de Tarefa
      description: Que tipo de trabalho você estava fazendo?
      id: task-type
      attributes:
        label: 🎯 Task Type
        description: What kind of work were you doing?
      options:
        - 🎆 Working on a new feature
        - 🐛 Fixing bugs
        - 🔄 Refactoring code
        - 📖 Writing tests
        - 📝 Documentation
        - 🎨 Design/UI work
        - 🔍 Complex debugging
        - 📋 Code review
        - 👥 Pair programming
        - 📈 Planning/architecture
        - 📚 Learning a new technology
        - Other

  - type: input
    id: rating
    attributes:
      label: ⭐ Rating (1-10)
      description: How would you rate this musical experience?
      placeholder: "E.g.: 8 (1=terrible, 10=perfect)"

  - type: textarea
    id: suggestions
    attributes:
      label: 💡 Suggestions for Improvement
      description: How could we improve?
      placeholder: |
        - Adjustments in BPM, instruments, structure?
        - New tracks for specific situations?
        - App features?
        - Integrations with tools?
        - Parameter personalization?

  - type: textarea
    id: comparison
    attributes:
      label: 🎵 Comparison with Other Music
      description: How does it compare with your usual soundtrack?
      placeholder: |
        - What type of music do you normally listen to while programming?
        - Is KernelMind better/worse/similar?
        - Artists or albums you would recommend as reference?
        - What makes music ideal for you to program to?

  - type: checkboxes
      id: terms
    attributes:
      label: Permissions
      description: Do you allow us to:
      options:
        - label: Use your feedback to improve existing tracks
          required: true
        - label: Quote your feedback (anonymously) in promotional materials
          required: false
        - label: Contact you for additional feedback on future versions
          required: false
        - label: Include your name in acknowledgments (if you want)
          required: false