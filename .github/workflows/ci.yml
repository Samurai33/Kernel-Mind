name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  # 📄 Lint and Format Check
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 🔍 Run ESLint
      run: npm run lint
      
    - name: 🎨 Check Prettier formatting
      run: npm run format:check
      
    - name: 📋 Check Markdown links
      run: npm run markdown:check

  # 🧪 Test Suite
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        node-version: [16, 18, 20]
        
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 🧪 Run tests
      run: npm run test:coverage
      
    - name: 📈 Upload coverage to Codecov
      if: matrix.node-version == 18
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # 🔒 Security Audit
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 🔍 Run npm audit
      run: npm audit --audit-level=high
      
    - name: 🔒 Run security scan
      run: npm run security:scan
      
  # 🎵 Audio Quality Check
  audio-quality:
    name: 🎵 Audio Quality
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[audio]') || github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔊 Setup audio tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg sox
        
    - name: 📊 Check audio file quality
      run: |
        find assets/audio -name "*.wav" -exec soxi {} \;
        find assets/audio -name "*.mp3" -exec ffprobe -v quiet -show_format {} \;
        
    - name: 🔊 Validate binaural frequencies
      run: npm run audio:validate

  # 📄 Documentation Build
  docs:
    name: 📄 Build Docs
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 📋 Build documentation
      run: npm run docs:build
      
    - name: 📄 Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/dist

  # 📦 Build Application
  build:
    name: 📦 Build App
    runs-on: ubuntu-latest
    needs: [test, security]
    
    strategy:
      matrix:
        platform: [web, electron, mobile]
        
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 📦 Build ${{ matrix.platform }}
      run: npm run build:${{ matrix.platform }}
      
    - name: 📋 Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ matrix.platform }}
        path: dist/${{ matrix.platform }}

  # 🚀 Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-web
        path: dist/
        
    - name: 🚀 Deploy to staging
      run: |
        # Deploy logic here
        echo "Deploying to staging environment..."
        
    - name: 📧 Notify team
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # 🌐 Deploy to Production
  deploy-production:
    name: 🌐 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    environment: production
    
    steps:
    - name: 📥 Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-web
        path: dist/
        
    - name: 🌐 Deploy to production
      run: |
        # Production deploy logic here
        echo "Deploying to production environment..."
        
    - name: 📧 Notify success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#general'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: ':rocket: KernelMind has been deployed to production!'

  # 📈 Performance Monitoring
  lighthouse:
    name: 📈 Lighthouse CI
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📈 Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v9
      with:
        configPath: './.lighthouserc.js'
        uploadArtifacts: true
        temporaryPublicStorage: true